<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실감형 콘텐츠 전문가 · 암기카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121316;
    --bg-raise: #1b1d22;
    --bg-card: #f4f1ea;
    --ink: #eeece5;
    --ink-dim: #a6a49c;
    --hairline: #34363c;
    --accent: #e0473b;
    --accent-dim: #8a2c26;
    --gold: #d9a441;
    --ok: #4f9d69;
    --ok-bg: #1c2a20;
    --bad: #d1554a;
    --bad-bg: #2b1c1b;
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 60px;
    min-height: 100vh;
  }

  /* ---------- Top brand ---------- */
  .brand{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 22px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .brand-badge{
    font-family:'Black Han Sans', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: var(--bg);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 4px;
    display:inline-block;
  }
  .brand-title{
    font-family:'Black Han Sans', sans-serif;
    font-size: 22px;
    letter-spacing: 0.5px;
    margin-left: 10px;
  }
  .brand-sub{ color: var(--ink-dim); font-size: 12.5px; }

  h1{ font-family:'Black Han Sans', sans-serif; font-weight:400; }

  /* ---------- Screens ---------- */
  .screen{ display:none; }
  .screen.active{ display:block; }

  /* ---------- Setup: scope tree ---------- */
  .section-label{
    font-size: 13px;
    color: var(--gold);
    font-weight: 700;
    margin: 26px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--hairline);
  }

  .all-btn{
    width:100%;
    text-align:left;
    background: var(--bg-raise);
    border: 1px solid var(--hairline);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 16px 18px;
    cursor:pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight:700;
    display:flex;
    justify-content:space-between;
    align-items:center;
    transition: border-color .15s ease, background .15s ease;
  }
  .all-btn:hover{ border-color: var(--accent); }
  .all-btn .count{ color: var(--ink-dim); font-weight:400; font-size:13px;}
  .all-btn.selected{ border-color: var(--accent); background: #241a17; }

  .tree{ display:flex; flex-direction:column; gap:8px; }
  .subject-block{
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    overflow:hidden;
    background: var(--bg-raise);
  }
  .node-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 12px 14px;
    cursor:pointer;
    user-select:none;
  }
  .node-row:hover{ background: rgba(255,255,255,0.03); }
  .node-row .chev{
    width:16px; height:16px; flex:none;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease;
    color: var(--ink-dim);
    font-size:11px;
  }
  .node-row.open .chev{ transform: rotate(90deg); }
  .node-text{ flex:1; font-size: 14.5px; }
  .node-pick{
    flex:none;
    font-size: 11.5px;
    color: var(--ink-dim);
    border: 1px solid var(--hairline);
    padding: 3px 9px;
    border-radius: 999px;
    background:transparent;
    cursor:pointer;
  }
  .node-pick:hover{ border-color: var(--accent); color: var(--ink); }
  .node-pick.selected{ border-color: var(--accent); background: var(--accent); color:#fff; }
  .node-count{ font-size:12px; color: var(--ink-dim); flex:none; min-width:34px; text-align:right;}

  .subject-row .node-text{ font-weight:700; font-size:15px; }
  .unit-list{ display:none; padding: 0 0 6px 14px; border-top:1px solid var(--hairline);}
  .unit-list.open{ display:block; }
  .unit-row .node-text{ font-weight:600; }
  .sub-list{ display:none; padding-left: 18px; }
  .sub-list.open{ display:block; }
  .sub-row .node-text{ font-size:13.5px; color: var(--ink-dim); }
  .sub-row.node-row{ padding: 9px 14px; }

  /* ---------- Direction + start ---------- */
  .dir-options{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .dir-card{
    border: 1px solid var(--hairline);
    background: var(--bg-raise);
    border-radius: var(--radius);
    padding: 16px;
    cursor:pointer;
    transition: border-color .15s ease;
  }
  .dir-card:hover{ border-color: var(--accent-dim); }
  .dir-card.selected{ border-color: var(--accent); background: #241a17; }
  .dir-card .dlabel{ font-weight:700; font-size:14px; margin-bottom:4px;}
  .dir-card .ddesc{ font-size:12px; color: var(--ink-dim); line-height:1.5;}

  .start-bar{
    margin-top: 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 16px;
  }
  .selection-summary{ font-size: 13px; color: var(--ink-dim); }
  .selection-summary b{ color: var(--ink); }
  .start-btn{
    font-family:'Black Han Sans', sans-serif;
    font-size: 17px;
    letter-spacing:0.5px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 14px 30px;
    cursor:pointer;
    transition: transform .1s ease, background .15s ease;
    flex:none;
  }
  .start-btn:hover{ background:#c93c31; }
  .start-btn:active{ transform: scale(0.97); }
  .start-btn:disabled{ background: var(--hairline); color: var(--ink-dim); cursor:not-allowed; }

  /* ---------- Study screen ---------- */
  .study-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom: 14px;
  }
  .back-link{
    color: var(--ink-dim);
    font-size: 13px;
    cursor:pointer;
    border:none;
    background:none;
    padding:6px 0;
    font-family:'Noto Sans KR',sans-serif;
  }
  .back-link:hover{ color: var(--ink); }
  .progress-text{ font-size: 13px; color: var(--ink-dim); font-variant-numeric: tabular-nums;}
  .progress-track{
    height: 4px;
    background: var(--hairline);
    border-radius: 999px;
    overflow:hidden;
    margin-bottom: 22px;
  }
  .progress-fill{
    height:100%;
    background: var(--accent);
    width:0%;
    transition: width .25s ease;
  }

  .card-scope{
    font-size: 11.5px;
    color: var(--gold);
    text-align:center;
    margin-bottom: 10px;
    letter-spacing: 0.3px;
  }

  .flip-stage{
    perspective: 1600px;
    height: 360px;
    margin-bottom: 20px;
  }
  .flip-card{
    position: relative;
    width:100%;
    height:100%;
    cursor:pointer;
    transform-style: preserve-3d;
    transition: transform .45s cubic-bezier(.2,.8,.3,1);
  }
  .flip-card.flipped{ transform: rotateY(180deg); }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius: 20px;
    background: var(--bg-card);
    color: #1c1c1a;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 34px 30px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    border: 1px solid rgba(0,0,0,0.06);
  }
  .face .kicker{
    position:absolute;
    top:18px; left:22px;
    font-size:11px;
    letter-spacing:0.6px;
    color:#8a8776;
    font-weight:700;
  }
  .face .tap-hint{
    position:absolute;
    bottom:16px; right:20px;
    font-size:10.5px;
    color:#a5a290;
  }
  .face-front .qtext{
    font-size: 19px;
    font-weight: 700;
    line-height: 1.55;
  }
  .face-back{ transform: rotateY(180deg); }
  .face-back .atext{
    font-family:'Black Han Sans', sans-serif;
    font-size: 26px;
    color: var(--accent-dim);
    margin-bottom: 14px;
    line-height:1.4;
  }
  .face-back .explain{
    font-size: 13.5px;
    color: #55524a;
    line-height: 1.6;
    max-height: 150px;
    overflow-y:auto;
  }

  .judge-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .judge-btn{
    font-family:'Noto Sans KR', sans-serif;
    font-weight:700;
    font-size: 15px;
    padding: 16px;
    border-radius: 14px;
    border: 1px solid var(--hairline);
    background: var(--bg-raise);
    color: var(--ink);
    cursor:pointer;
    transition: transform .08s ease, border-color .15s ease;
  }
  .judge-btn:active{ transform: scale(0.97); }
  .judge-btn.no{ border-color: var(--bad); color: #f0a49d; }
  .judge-btn.no:hover{ background: var(--bad-bg); }
  .judge-btn.yes{ border-color: var(--ok); color: #a9d6b8; }
  .judge-btn.yes:hover{ background: var(--ok-bg); }
  .judge-hint{
    text-align:center;
    font-size:12px;
    color: var(--ink-dim);
    margin-top:14px;
  }

  /* ---------- Result screen ---------- */
  .result-hero{
    text-align:center;
    padding: 30px 10px 10px;
  }
  .result-num{
    font-family:'Black Han Sans', sans-serif;
    font-size: 56px;
    color: var(--accent);
    line-height:1;
  }
  .result-label{ color: var(--ink-dim); font-size:14px; margin-top:6px;}
  .result-split{
    display:flex;
    justify-content:center;
    gap: 34px;
    margin: 26px 0 8px;
  }
  .result-split div{ text-align:center; }
  .result-split .n{ font-size: 24px; font-weight:700; }
  .result-split .l{ font-size:12px; color:var(--ink-dim); margin-top:2px;}
  .ok-color{ color: var(--ok); }
  .bad-color{ color: var(--bad); }

  .result-actions{
    display:flex;
    flex-direction:column;
    gap: 10px;
    margin-top: 30px;
  }
  .rbtn{
    font-family:'Noto Sans KR', sans-serif;
    font-size: 15px;
    font-weight:700;
    padding: 15px;
    border-radius: 999px;
    border: none;
    cursor:pointer;
    text-align:center;
  }
  .rbtn.primary{ background: var(--accent); color:#fff; }
  .rbtn.primary:hover{ background:#c93c31; }
  .rbtn.secondary{ background: var(--bg-raise); color: var(--ink); border:1px solid var(--hairline); }
  .rbtn.secondary:hover{ border-color: var(--accent); }
  .rbtn:disabled{ opacity:0.4; cursor:not-allowed; }

  @media (max-width: 480px){
    .flip-stage{ height: 400px; }
    .face-front .qtext{ font-size:17px; }
    .face-back .atext{ font-size:22px; }
    .dir-options{ grid-template-columns: 1fr; }
    .start-bar{ flex-direction:column; align-items:stretch; }
    .start-btn{ width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <div>
      <span class="brand-badge">3급</span><span class="brand-title">실감형 콘텐츠 전문가</span>
      <div class="brand-sub">암기카드 · Quizlet 스타일</div>
    </div>
  </div>

  <!-- ============ SETUP SCREEN ============ -->
  <div id="screen-setup" class="screen active">

    <div class="section-label">학습 범위</div>
    <button class="all-btn" id="all-btn" data-scope-type="all">
      <span>전체 문제</span>
      <span class="count" id="all-count">0문항</span>
    </button>

    <div class="tree" id="tree" style="margin-top:10px;"></div>

    <div class="section-label">학습 방향</div>
    <div class="dir-options">
      <div class="dir-card selected" data-dir="qa" id="dir-qa">
        <div class="dlabel">문제 → 정답</div>
        <div class="ddesc">질문을 보고 정답을 떠올려요. (정답 암기 모드)</div>
      </div>
      <div class="dir-card" data-dir="aq" id="dir-aq">
        <div class="dlabel">정답 → 문제</div>
        <div class="ddesc">정답(용어)을 보고 어떤 질문인지 떠올려요. (용어 암기 모드)</div>
      </div>
    </div>

    <div class="section-label">카드 순서</div>
    <div class="dir-options">
      <div class="dir-card selected" data-shuffle="1" id="shuffle-on">
        <div class="dlabel">순서 섞기</div>
        <div class="ddesc">매 학습마다 카드 순서를 랜덤으로 섞어요.</div>
      </div>
      <div class="dir-card" data-shuffle="0" id="shuffle-off">
        <div class="dlabel">원래 순서</div>
        <div class="ddesc">문항 번호 순서대로 학습해요.</div>
      </div>
    </div>

    <div class="start-bar">
      <div class="selection-summary" id="selection-summary">범위를 선택하세요</div>
      <button class="start-btn" id="start-btn" disabled>학습 시작</button>
    </div>
  </div>

  <!-- ============ STUDY SCREEN ============ -->
  <div id="screen-study" class="screen">
    <div class="study-top">
      <button class="back-link" id="quit-btn">← 범위 다시 선택</button>
      <div class="progress-text" id="progress-text">1 / 1</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="card-scope" id="card-scope"></div>

    <div class="flip-stage">
      <div class="flip-card" id="flip-card">
        <div class="face face-front">
          <span class="kicker" id="front-kicker">문제</span>
          <div class="qtext" id="front-text"></div>
          <span class="tap-hint">탭하여 뒤집기</span>
        </div>
        <div class="face face-back">
          <span class="kicker" id="back-kicker">정답</span>
          <div class="atext" id="back-text"></div>
          <div class="explain" id="back-explain"></div>
        </div>
      </div>
    </div>

    <div class="judge-row">
      <button class="judge-btn no" id="judge-no">✕ 모르겠어요</button>
      <button class="judge-btn yes" id="judge-yes">✓ 알아요</button>
    </div>
    <div class="judge-hint">카드를 탭하면 뒤집혀요 · 스페이스바로도 뒤집을 수 있어요</div>
  </div>

  <!-- ============ RESULT SCREEN ============ -->
  <div id="screen-result" class="screen">
    <div class="result-hero">
      <div class="result-num" id="result-total">0</div>
      <div class="result-label">문제를 학습했어요</div>
      <div class="result-split">
        <div><div class="n ok-color" id="result-ok">0</div><div class="l">알아요</div></div>
        <div><div class="n bad-color" id="result-bad">0</div><div class="l">모르겠어요</div></div>
      </div>
    </div>
    <div class="result-actions">
      <button class="rbtn primary" id="retry-wrong">틀린 문제만 다시 학습</button>
      <button class="rbtn secondary" id="retry-all">이번 범위 처음부터 다시</button>
      <button class="rbtn secondary" id="back-to-setup">범위 다시 선택</button>
    </div>
  </div>

</div>

<script>

 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 8, "q": "시장 분석을 위해 국내외 특허 정보를 제공하는 전문 기관 사이트는?", "a": "키프리스(KIPRIS)", "explain": "키프리스(KIPRIS)는 국내외 특허 정보를 제공하는 기관입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 9, "q": "현재와 과거의 자료에 근거해 미래 사회 변화의 모습을 투사하고 예측하는 분석 방법은?", "a": "트렌드 분석", "explain": "트렌드 분석은 과거/현재 자료를 토대로 미래 변화를 투사하는 방법입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 10, "q": "요소 기술적인 분석을 위해 특정 그룹을 대상으로 테스트를 진행하는 기법의 약칭은?", "a": "FGT", "explain": "포커스 그룹 테스트(FGT)는 특정 그룹을 활용한 니즈 파악 방법입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 11, "q": "콘텐츠가 의도하는 사용자의 모습을 가상으로 그려 사용자 프로파일을 정의하는 디자인 도구는?", "a": "페르소나", "explain": "페르소나는 타깃 사용자의 성별, 연령, 직업 등을 분석하여 구체화한 가상의 모습입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 12, "q": "추상적인 개념의 관계를 시각화하여 정보의 연계 체계의 우선순위를 보여주는 결과물은?", "a": "콘셉트 모델", "explain": "콘셉트 모델은 각 개념의 연계 체계와 기능의 상대적 우선순위를 시각적으로 표현합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 13, "q": "사용자의 경험을 선형적으로 시각화하여 이용 전, 후의 개발 순간을 평가하는 방법은?", "a": "사용자 여정 지도", "explain": "사용자 여정 지도는 이용 흐름에 따른 경험을 시각화하여 편의성을 향상시키는 도구입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 14, "q": "사용자 여정 지도를 작성할 때 가장 크게 서비스되는 흐름을 설정하고 무엇을 분리해야 하는가?", "a": "공간", "explain": "서비스 흐름을 설정한 후에는 '검색-인터랙션-저장' 등과 같이 공간을 크게 분리하여 설정합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 15, "q": "영국 정부 디자인 원칙 가이드 중 '웹 사이트 개발이 아닌 이것을 건설하라'고 강조한 것은?", "a": "디지털 서비스", "explain": "영국 정부 디자인 원칙 8번은 '디지털 서비스를 건설할 것(웹 사이트 개발이 아니다)'입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 16, "q": "화면의 기능이 쉽게 이해되고 조작이 자유로워야 한다는 디자인 원칙은?", "a": "가시성의 원칙", "explain": "가시성의 원칙은 기능이 쉽게 이해되고 조작이 자유로워야 함을 의미합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 17, "q": "조작 부위만 보고도 결과를 미리 예견할 수 있도록 디자인하는 원칙은?", "a": "조작 결과 예견의 원칙", "explain": "Natural Mapping은 조작 결과에 대한 공간적/기능적 유추가 가능하도록 하는 원칙입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 18, "q": "버튼, 그래픽 요소, 텍스트, 컬러 등의 조작 방식이 일관해야 한다는 원칙은?", "a": "일관성의 원칙", "explain": "일관성의 원칙은 조작 방식과 디자인 요소들이 일관하게 유지되어야 함을 뜻합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 19, "q": "선택의 여지를 줄여 조작 방법이 명확하도록 만드는 디자인 원칙은?", "a": "제한점 이용의 원칙", "explain": "제한점 이용의 원칙은 조작의 제한 사항을 이용해 선택 폭을 좁혀 명확성을 높이는 것입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 20, "q": "도널드 노먼이 정의한 개념으로, 제품을 어떻게 다루면 될지 행동을 자연스럽게 유도하는 속성은?", "a": "어포던스(Affordance)", "explain": "어포던스(행동 유도성)는 사용자가 자연스럽게 특정 행동을 하도록 유도하는 디자인 요소입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 21, "q": "어포던스(Affordance)의 한국어 번역 용어로 적절하지 않은 것은?", "a": "심미성", "explain": "어포던스는 행동 유도성, 행위 유발성, 직관성 등으로 번역되지만 심미성과는 다른 개념입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 22, "q": "제임스 깁슨이 제시한 어포던스의 정의는 무엇과 액터 사이의 실행 가능한 속성인가?", "a": "세상", "explain": "제임스 깁슨은 세상과 액터(사람/동물) 사이의 실행 가능한 속성을 어포던스라 정의했습니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 23, "q": "조작 오류를 쉽게 발견하고 수정하기 용이하게 해야 한다는 디자인 원칙은?", "a": "조작 오류의 원칙", "explain": "조작 오류의 원칙은 오류 발견과 수정을 용이하게 디자인하는 원칙입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 24, "q": "사용자 분석 결과를 바탕으로 실제 제작에 앞서 디자인 개선안을 확인하기 위해 제작하는 것은?", "a": "프로토타입", "explain": "제안된 디자인 개선안을 검증하기 위해 프로토타입을 제작합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 25, "q": "인터페이스 디자인 절차 중 실제 사용자와 관련 업무 대상자를 중심으로 실시하는 평가는?", "a": "사용성 평가(Usability Testing)", "explain": "프로토타입 제작 후 사용성 평가를 실시하여 디자인을 수정 보완합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 26, "q": "UX 디자인이 좋았을 때 사용자가 느끼는 감정에 해당하지 않는 것은?", "a": "좌절(Frustration)", "explain": "좌절은 UX 디자인이 나빴을 때 나타나는 부정적 감정입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 27, "q": "니즈 파악을 위해 실시하는 설문 조사에서 설문 소요 시간은 어느 정도가 바람직한가?", "a": "5분 이내", "explain": "설문은 피로감을 줄이기 위해 5분 이내에 마무리될 수 있는 수준이 바람직합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 28, "q": "인터뷰를 진행할 때 신뢰도 높은 의견을 얻기 위한 가장 중요한 자세는?", "a": "경청하는 자세 유지", "explain": "상대방의 의견을 끄집어내기 위해 경청하는 자세를 유지하는 것이 중요합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 29, "q": "사용자 인터페이스의 검측 중 '디스플레이 휘도나 키보드 배열' 등과 관련된 것은?", "a": "인간 공학적인 물리적 검측", "explain": "모양, 배열 등은 인간 공학적인 물리적 검측에 해당합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-1. 인터페이스 요구사항 파악 및 제작", "num": 30, "q": "사용자 여정 지도를 서비스 이용 시점에 따라 나눌 때 적절한 구분은?", "a": "이용 전-중-후", "explain": "사용자 여정 지도는 서비스 이용 전, 중, 후로 구분하여 작성합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-2. 시나리오 기반 스토리보드 작성", "num": 1, "q": "스토리보드의 정의로 가장 적절한 것은?", "a": "연속된 정지 이미지의 흐름으로 스토리를 미리 영상화시키는 계획표", "explain": "스토리보드는 영상물을 제작하기 위해 연속된 정지 이미지 흐름으로 스토리를 미리 영상화시키는 계획표를 의미합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-2. 시나리오 기반 스토리보드 작성", "num": 2, "q": "스토리보드의 구성 요소 중 '각본'에 대한 설명으로 옳은 것은?", "a": "대사나 동작 등의 제작에 필요한 사항을 적은 글", "explain": "각본이란 대사나 동작 등의 상연이나 제작에 필요한 사항을 적은 글을 의미합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "01. 증강현실 UI/UX 설계", "sub": "1-2. 시나리오 기반 스토리보드 작성", "num": 3, "q": "스토리보드의 구성 요소 중 '객체 요소'에 해당하지 않는 것은?  않은 것은?", "a": "실시간 갱신성", "explain": "분석 데이터는 요약 레벨, 주제 지향성, 통합성, 시계열성, 비휘발성 등이 기준에 따라 관리되며, 실시간 갱신은 주로 운영 데이터의 특징입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 7, "q": "정보 시스템 간 데이터를 이동할 때 소스 데이터와 타깃 데이터 간의 연결 정보를 관리하는 데이터는?", "a": "매핑 데이터", "explain": "매핑 데이터는 정보 시스템 데이터를 다른 시스템으로 이동할 때 사용하는 소스와 타깃 데이터 간의 매핑 정보를 관리합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 8, "q": "데이터의 정합성을 확보하고 품질 유지 및 개선 활동을 수행하기 위해 기본적으로 관리되어야 하는 데이터는?", "a": "품질 관리 데이터", "explain": "품질 관리 데이터는 데이터 정합성 확보와 품질 개선 활동을 수행할 때 기본적으로 관리되는 데이터입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 9, "q": "데이터베이스 설계 과정 중 '사용자의 요구 사항을 분석하여 정보의 구조를 ER 다이어그램으로 표현'하는 단계는?", "a": "개념적 설계", "explain": "개념적 설계 단계에서는 요구 분석 결과를 바탕으로 정보의 구조를 개념적으로 표현하며, 주로 ERD를 사용합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 10, "q": "개념적 설계 단계에서 도출된 구조를 특정 DBMS가 처리할 수 있는 테이블 구조로 변환하는 단계는?", "a": "논리적 설계", "explain": "논리적 설계 단계에서는 개념적 구조를 특정 DBMS의 데이터 모델(관계형 등)에 맞춰 논리적 구조로 변환합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 11, "q": "데이터베이스의 설계 중 레코드 길이, 인덱스 설계, 저장 경로 등 물리적 저장 장치와 관련된 사항을 결정하는 단계는?", "a": "물리적 설계", "explain": "물리적 설계는 논리적 데이터 구조를 물리적 저장 장치에 저장할 수 있는 물리적 구조로 설계하는 단계입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 12, "q": "ER 모델의 구성 요소 중 '독립된 의미를 가지고 관리되는 대상'을 의미하며 사각형으로 표시하는 것은?", "a": "개체(Entity)", "explain": "개체(Entity)는 데이터베이스에서 관리하려는 독립적인 대상이며 ERD에서 사각형으로 표현됩니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 13, "q": "ER 모델에서 개체가 가지고 있는 고유한 특성을 의미하며 타원형으로 표시하는 것은?", "a": "속성", "explain": "속성(Attribute)은 개체가 가지는 구체적인 정보 항목이나 특성을 나타내며 ERD에서 타원으로 표현됩니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 14, "q": "ER 모델에서 개체와 개체 사이의 연관성을 의미하며 마름모꼴로 표시하는 것은?", "a": "관계", "explain": "관계(Relationship)는 개체 간의 의미 있는 연관성을 나타내며 ERD에서 마름모로 표현됩니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 15, "q": "데이터 모델의 관계 유형 중 '한 명의 학생이 여러 개의 과목을 수강할 수 있고, 한 과목도 여러 학생이 수강할 수 있는' 관계는?", "a": "N:M 관계", "explain": "양측 개체 타입에서 서로 여러 개의 인스턴스와 관계를 맺을 수 있는 것을 N:M(다대다) 관계라고 합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 16, "q": "데이터베이스에서 중복을 제거하고 데이터 이상 현상을 방지하기 위해 테이블 구조를 분해하는 과정은?", "a": "정규화(Normalization)", "explain": "정규화는 테이블의 중복을 최소화하고 무결성을 유지하기 위해 테이블을 적절히 분해하는 과정입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 17, "q": "정규화 단계 중 '모든 속성 값이 원자 값(Atomic Value)을 가져야 한다'는 조건은?", "a": "제1정규형(1NF)", "explain": "제1정규형은 테이블의 모든 속성 값이 원자 값으로 구성되어야 한다는 조건입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 18, "q": "제1정규형을 만족하면서, 기본키가 아닌 모든 속성이 기본키에 대해 '완전 함수 종속'인 상태는?", "a": "제2정규형(2NF)", "explain": "제2정규형은 제1정규형을 만족하고, 기본키의 일부분에만 종속되는 부분 함수 종속을 제거한 상태입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 19, "q": "제2정규형을 만족하면서, 기본키가 아닌 속성 간의 '이행적 함수 종속'을 제거한 상태는?", "a": "제3정규형(3NF)", "explain": "제3정규형은 제2정규형을 만족하고, 속성 간의 이행적 종속성(A→B, B→C이면 A→C)을 제거한 것입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 20, "q": "개체를 유일하게 식별할 수 있는 속성 집합으로, NULL 값을 가질 수 없는 제약 조건이 있는 키는?", "a": "기본키(Primary Key)", "explain": "기본키는 개체를 식별하는 핵심 키로, 중복될 수 없으며 NULL 값을 가질 수 없습니다(개체 무결성)."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 21, "q": "다른 테이블의 기본키를 참조하여 테이블 간의 연결을 유지하는 키는?", "a": "외래키", "explain": "외래키는 다른 릴레이션의 기본키를 참조하는 속성으로, 참조 무결성을 유지하는 역할을 합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 22, "q": "무결성 제약 조건 중 '기본키의 속성 값은 NULL일 수 없으며 중복되어서도 안 된다'는 원칙은?", "a": "개체 무결성", "explain": "개체 무결성은 모든 테이블이 기본키를 가져야 하며 그 값은 고유하고 NULL이 아니어야 한다는 원칙입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 23, "q": "외래키 값은 참조하는 테이블의 기본키 값과 일치하거나 NULL이어야 한다는 제약 조건은?", "a": "참조 무결성", "explain": "참조 무결성은 릴레이션 간의 참조 관계를 정의하며 데이터 일관성을 유지하기 위한 제약 조건입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 24, "q": "데이터베이스 언어 중 '테이블을 생성(CREATE), 수정(ALTER), 삭제(DROP)'하는 기능은 어디에 속하는가?", "a": "데이터 정의어(DDL)", "explain": "DDL(Data Definition Language)은 데이터베이스 스키마를 정의하거나 변경하기 위해 사용됩니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 25, "q": "데이터베이스의 데이터를 조회(SELECT), 삽입(INSERT), 수정(UPDATE), 삭제(DELETE)하는 SQL 문은 어디에 속하는가?", "a": "DML", "explain": "DML(Data Manipulation Language)은 데이터를 실질적으로 처리하기 위해 사용되는 언어입니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 26, "q": "권한 부여(GRANT) 및 취소(REVOKE)와 같이 데이터 제어를 담당하는 언어는?", "a": "DCL", "explain": "DCL(Data Control Language)은 데이터 무결성 유지, 보안, 권한 제어 등을 담당합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 27, "q": "데이터베이스의 효율적인 관리를 위해 수행하는 '데이터베이스 안전 관리' 활동에 해당하지 않는 것은?", "a": "임시 파일 무단 삭제", "explain": "DB 안전 관리는 데이터 보호, 권한 관리, 백업 등을 포함하며, 무단 파일 삭제는 관련 활동이 아닙니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 28, "q": "데이터베이스의 중복성을 최소화하되 통제가 가능한 중복만 허용하는 특징을 무엇이라 하는가?", "a": "통합 데이터", "explain": "통합 데이터는 데이터 중복을 최소화하여 관리 효율을 높인 상태를 의미합니다."}, {"subject": "2과목 증강현실 콘텐츠 제작", "unit": "03. 증강현실 콘텐츠 데이터 관리", "sub": "3-1. 데이터베이스 구조 설계 및 생성", "num": 29, "q": "데이터 속성 중 '문자형(CHAR)', '숫자형(INT)' 등 데이터의 형태를 정의하는 /* ---------- Build hierarchy ---------- */
const hierarchy = {}; // subject -> unit -> sub -> [items]
RAW_DATA.forEach((item, idx) => {
  item._id = idx;
  hierarchy[item.subject] = hierarchy[item.subject] || {};
  hierarchy[item.subject][item.unit] = hierarchy[item.subject][item.unit] || {};
  hierarchy[item.subject][item.unit][item.sub] = hierarchy[item.subject][item.unit][item.sub] || [];
  hierarchy[item.subject][item.unit][item.sub].push(item);
});

let selectedScope = { type: 'all', label: '전체 문제' };
let selectedDir = 'qa';
let selectedShuffle = true;

/* ---------- Render tree ---------- */
const treeEl = document.getElementById('tree');
document.getElementById('all-count').textContent = RAW_DATA.length + '문항';

function countOf(obj){
  // obj can be array (sub) or nested dict (unit/subject)
  if(Array.isArray(obj)) return obj.length;
  let c = 0;
  Object.values(obj).forEach(v => c += countOf(v));
  return c;
}

Object.keys(hierarchy).forEach(subject => {
  const subjBlock = document.createElement('div');
  subjBlock.className = 'subject-block';

  const subjRow = document.createElement('div');
  subjRow.className = 'node-row subject-row';
  subjRow.innerHTML = `
    <span class="chev">▶</span>
    <span class="node-text">${subject}</span>
    <span class="node-count">${countOf(hierarchy[subject])}문항</span>
    <button class="node-pick" data-type="subject" data-subject="${subject}">이 범위</button>
  `;
  subjBlock.appendChild(subjRow);

  const unitList = document.createElement('div');
  unitList.className = 'unit-list';

  Object.keys(hierarchy[subject]).forEach(unit => {
    const unitRow = document.createElement('div');
    unitRow.className = 'node-row unit-row';
    unitRow.innerHTML = `
      <span class="chev">▶</span>
      <span class="node-text">${unit}</span>
      <span class="node-count">${countOf(hierarchy[subject][unit])}문항</span>
      <button class="node-pick" data-type="unit" data-subject="${subject}" data-unit="${unit}">이 범위</button>
    `;
    unitList.appendChild(unitRow);

    const subList = document.createElement('div');
    subList.className = 'sub-list';

    Object.keys(hierarchy[subject][unit]).forEach(sub => {
      const subRow = document.createElement('div');
      subRow.className = 'node-row sub-row';
      subRow.innerHTML = `
        <span style="width:16px;"></span>
        <span class="node-text">${sub}</span>
        <span class="node-count">${hierarchy[subject][unit][sub].length}문항</span>
        <button class="node-pick" data-type="sub" data-subject="${subject}" data-unit="${unit}" data-sub="${sub}">이 범위</button>
      `;
      subList.appendChild(subRow);
    });

    unitList.appendChild(subList);

    unitRow.addEventListener('click', (e) => {
      if(e.target.classList.contains('node-pick')) return;
      unitRow.classList.toggle('open');
      subList.classList.toggle('open');
    });
  });

  subjBlock.appendChild(unitList);
  treeEl.appendChild(subjBlock);

  subjRow.addEventListener('click', (e) => {
    if(e.target.classList.contains('node-pick')) return;
    subjRow.classList.toggle('open');
    unitList.classList.toggle('open');
  });
});

}

function getItemsForScope(scope){
  if(scope.type === 'all') return RAW_DATA.slice();
  if(scope.type === 'subject') return countGetSubject(scope.subject);
  if(scope.type === 'unit') return countGetUnit(scope.subject, scope.unit);
  if(scope.type === 'sub') return hierarchy[scope.subject][scope.unit][scope.sub].slice();
  return [];
}
function countGetSubject(subject){
  let arr = [];
  Object.values(hierarchy[subject]).forEach(unit => {
    Object.values(unit).forEach(sub => arr = arr.concat(sub));
  });
  return arr;
}
function countGetUnit(subject, unit){
  let arr = [];
  Object.values(hierarchy[subject][unit]).forEach(sub => arr = arr.concat(sub));
  return arr;
}

function updateSelectionUI(){
  const items = getItemsForScope(selectedScope);
  document.getElementById('selection-summary').innerHTML =
    `<b>${selectedScope.label}</b> · ${items.length}문항 선택됨`;
  document.getElementById('start-btn').disabled = items.length === 0;
}

document.getElementById('all-btn').addEventListener('click', () => {
  clearPickSelection();
  document.getElementById('all-btn').classList.add('selected');
  selectedScope = { type:'all', label:'전체 문제' };
  updateSelectionUI();
});

treeEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.node-pick');
  if(!btn) return;
  clearPickSelection();
  btn.classList.add('selected');
  const type = btn.dataset.type;
  if(type === 'subject'){
    selectedScope = { type:'subject', subject:btn.dataset.subject, label: btn.dataset.subject };
  } else if(type === 'unit'){
    selectedScope = { type:'unit', subject:btn.dataset.subject, unit:btn.dataset.unit, label: btn.dataset.unit };
  } else {
    selectedScope = { type:'sub', subject:btn.dataset.subject, unit:btn.dataset.unit, sub:btn.dataset.sub, label: btn.dataset.sub };
  }
  updateSelectionUI();
});

document.getElementById('dir-qa').addEventListener('click', () => {
  selectedDir = 'qa';
  document.getElementById('dir-qa').classList.add('selected');
  document.getElementById('dir-aq').classList.remove('selected');
});
document.getElementById('dir-aq').addEventListener('click', () => {
  selectedDir = 'aq';
  document.getElementById('dir-aq').classList.add('selected');
  document.getElementById('dir-qa').classList.remove('selected');
});

document.getElementById('shuffle-on').addEventListener('click', () => {
  selectedShuffle = true;
  document.getElementById('shuffle-on').classList.add('selected');
  document.getElementById('shuffle-off').classList.remove('selected');
});
document.getElementById('shuffle-off').addEventListener('click', () => {
  selectedShuffle = false;
  document.getElementById('shuffle-off').classList.add('selected');
  document.getElementById('shuffle-on').classList.remove('selected');
});

/* ---------- default select "all" ---------- */
document.getElementById('all-btn').classList.add('selected');
updateSelectionUI();

/* ---------- Study session ---------- */
let deck = [];        // current round's items
let results = {};     // id -> true(ok)/false(bad), for current full pool
let idx = 0;
let flipped = false;
let poolItems = [];   // full pool for this scope (used for "retry all")

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startSession(items){
  poolItems = items;
  deck = selectedShuffle ? shuffle(items) : items.slice();
  results = {};
  idx = 0;
  document.getElementById('card-scope').textContent = selectedScope.label
    + (selectedDir === 'qa' ? ' · 문제→정답' : ' · 정답→문제')
    + (selectedShuffle ? ' · 랜덤 순서' : ' · 원래 순서');
  showScreen('screen-study');
  renderCard();
}

function renderCard(){
  flipped = false;
  const card = document.getElementById('flip-card');
  card.classList.remove('flipped');
  const item = deck[idx];

  const frontIsQ = selectedDir === 'qa';
  document.getElementById('front-kicker').textContent = frontIsQ ? '문제' : '정답';
  document.getElementById('back-kicker').textContent = frontIsQ ? '정답' : '문제';
  document.getElementById('front-text').textContent = frontIsQ ? item.q : item.a;
  document.getElementById('back-text').textContent = frontIsQ ? item.a : item.q;
  document.getElementById('back-explain').textContent = item.explain || '';

  document.getElementById('progress-text').textContent = (idx+1) + ' / ' + deck.length;
  document.getElementById('progress-fill').style.width = (100*(idx)/deck.length) + '%';
}

document.getElementById('flip-card').addEventListener('click', () => {
  flipped = !flipped;
  document.getElementById('flip-card').classList.toggle('flipped', flipped);
});

function judge(ok){
  const item = deck[idx];
  results[item._id] = ok;
  if(idx < deck.length - 1){
    idx++;
    renderCard();
  } else {
    finishRound();
  }
}
document.getElementById('judge-yes').addEventListener('click', () => judge(true));
document.getElementById('judge-no').addEventListener('click', () => judge(false));

document.addEventListener('keydown', (e) => {
  if(!document.getElementById('screen-study').classList.contains('active')) return;
  if(e.code === 'Space'){
    e.preventDefault();
    flipped = !flipped;
    document.getElementById('flip-card').classList.toggle('flipped', flipped);
  } else if(e.code === 'ArrowRight'){
    judge(true);
  } else if(e.code === 'ArrowLeft'){
    judge(false);
  }
});

function finishRound(){
  document.getElementById('progress-fill').style.width = '100%';
  const total = deck.length;
  const okCount = Object.values(results).filter(v => v === true).length;
  const badCount = Object.values(results).filter(v => v === false).length;
  document.getElementById('result-total').textContent = total;
  document.getElementById('result-ok').textContent = okCount;
  document.getElementById('result-bad').textContent = badCount;
  document.getElementById('retry-wrong').disabled = badCount === 0;
  showScreen('screen-result');
}

document.getElementById('start-btn').addEventListener('click', () => {
  const items = getItemsForScope(selectedScope);
  if(items.length === 0) return;
  startSession(items);
});

document.getElementById('quit-btn').addEventListener('click', () => {
  showScreen('screen-setup');
});
document.getElementById('back-to-setup').addEventListener('click', () => {
  showScreen('screen-setup');
});
document.getElementById('retry-all').addEventListener('click', () => {
  startSession(poolItems);
});
document.getElementById('retry-wrong').addEventListener('click', () => {
  const wrongIds = Object.keys(results).filter(id => results[id] === false).map(Number);
  const wrongItems = poolItems.filter(it => wrongIds.includes(it._id));
  if(wrongItems.length === 0) return;
  startSession(wrongItems);
});
</script>
</body>
